plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	runs {
		configureEach {
			it.getGenerateRunConfig().set(true)
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "maven.modrinth:modmenu:${modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_version_compatible", project.minecraft_version_compatible
	inputs.property "loader_compatible", project.loader_compatible
	inputs.property "java_compatible", project.java_compatible
	inputs.property "fabric_api_compatible", project.fabric_api_compatible

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version_compatible": project.minecraft_version_compatible, "loader_compatible": project.loader_compatible, "java_compatible": project.java_compatible, "fabric_api_compatible": project.fabric_api_compatible
	}
}
